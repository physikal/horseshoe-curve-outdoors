name: Assemble package-lock
on:
  push:
    paths: ['.lock-parts/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cat .lock-parts/*.part > package-lock.json && wc -c package-lock.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet || (git commit -m "Assemble package-lock.json" && git push)
